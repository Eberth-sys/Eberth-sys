<svg xmlns="http://www.w3.org/2000/svg" width="840" height="160" viewBox="0 0 840 160" role="img" aria-labelledby="t">
  <title id="t">GitHub stats: 1,509 contributions since 2020, 208 active days, 14-day longest streak, 53 pull requests</title>
  <style>
