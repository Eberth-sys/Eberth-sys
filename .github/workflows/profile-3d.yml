name: Generate 3D contribution calendar

on:
  # 03:00 in Santiago (UTC-3)
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Writes every theme to ./profile-3d-contrib; the README uses profile-night-view.svg.
      # Add a PROFILE_TOKEN secret (read-only PAT) to also count languages from private repos.
      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Published to the "output" branch so daily updates don't add commits to main.
      # Served from https://raw.githubusercontent.com/<user>/<repo>/output/<file>
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
