name: Generate contribution game

on:
  # 03:00 in Santiago (UTC-3)
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Writes dist/<game>-contribution-graph.svg and its -dark variant.
      # Other games: pacman, breakout, galaga, puzzle-bobble, minesweeper
      - name: Generate Bomberman contribution SVGs
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: bomberman

      # Published to the "output" branch so daily updates don't add commits to main.
      # Served from https://raw.githubusercontent.com/<user>/<repo>/output/<file>
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
